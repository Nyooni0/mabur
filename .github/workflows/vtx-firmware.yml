name: VTX firmware

# Builds the OpenIPC firmware image for the RunCam WiFiLink 2
# (SSC338Q + IMX415 + RTL8812EU) from this checkout. The resulting
# openipc.ssc338q-nor-*.tgz is the Companion local-file image.
#
# A build downloads the OpenIPC toolchain and compiles a full Buildroot
# image (tens of minutes). It needs the mabur OpenIPC builder fork because
# upstream does not carry package/mabur. Manual only: a push to a branch
# would start a full image build on every commit.
on:
  workflow_dispatch:
    inputs:
      target:
        description: OpenIPC builder target
        required: true
        default: ssc338q_fpv_openipc-urllc-aio
        type: string
      telemetry:
        description: FC telemetry wiring for the image config
        required: true
        default: mavlink
        type: choice
        options: [mavlink, msp]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout mabur
        uses: actions/checkout@v5
        with:
          path: mabur

      - name: Checkout OpenIPC builder fork
        uses: actions/checkout@v5
        with:
          repository: gilankpam/openipc-builder
          ref: feat/mabur
          path: openipc-builder

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git cmake pkg-config \
            bc bison flex gawk m4 texinfo \
            patch file rsync cpio tree whiptail \
            unzip zip gzip bzip2 xz-utils zstd tar \
            wget curl ca-certificates \
            python3 python-is-python3 perl \
            libssl-dev libncurses-dev libelf-dev zlib1g-dev \
            libtool automake autoconf gettext

      - name: Point the mabur package at this checkout
        run: |
          set -euo pipefail
          MK=openipc-builder/package/mabur/mabur.mk
          sed -i "s|^MABUR_SITE = .*|MABUR_SITE = $GITHUB_WORKSPACE/mabur|" "$MK"
          sed -i 's|^MABUR_SITE_METHOD = .*|MABUR_SITE_METHOD = local|' "$MK"
          sed -i 's|^MABUR_BRANCH = .*|MABUR_VERSION = local|' "$MK"
          grep -E '^MABUR_(SITE|SITE_METHOD|VERSION) ' "$MK"

      - name: Select telemetry config
        env:
          TELEMETRY: ${{ inputs.telemetry || 'mavlink' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib
          p = pathlib.Path("mabur/bundle/mabur.default.toml")
          lines = p.read_text().splitlines()
          out, sec = [], None
          for line in lines:
              if line.startswith("["):
                  sec = line.strip()
              if sec == "[msp]" and line.strip().startswith("enable"):
                  line = "enable = false" if os.environ["TELEMETRY"] == "mavlink" else "enable = true"
              if sec == "[mavlink]" and line.strip().startswith("enable"):
                  line = "enable = true" if os.environ["TELEMETRY"] == "mavlink" else "enable = false"
              if sec == "[mavlink]" and line.strip().startswith("serial"):
                  line = 'serial = "/dev/ttyS2"'
              out.append(line)
          p.write_text("\n".join(out) + "\n")
          PY
          sed -n '/^\[msp\]/,/^\[/p; /^\[mavlink\]/,/^\[/p' mabur/bundle/mabur.default.toml

      - name: Build OpenIPC image
        working-directory: openipc-builder
        env:
          # NOTE: do not call this TARGET. The OpenIPC firmware Makefile uses
          # TARGET as its output directory, so an env var of that name turns
          # BR_CONF into <device>/openipc_defconfig and the build dies.
          VTX_TARGET: ${{ inputs.target || 'ssc338q_fpv_openipc-urllc-aio' }}
        run: |
          set -euo pipefail
          # Detached checkout: skip the builder's self-update, which would fail.
          sed -i 's/^git pull$/true/' builder.sh
          ./builder.sh "$VTX_TARGET"
          test -n "$(find archive -type f -print -quit)"
          ls -lR archive/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: vtx-firmware-${{ inputs.target || 'ssc338q_fpv_openipc-urllc-aio' }}-${{ inputs.telemetry || 'mavlink' }}
          path: |
            openipc-builder/archive/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vtx-build-logs
          path: |
            openipc-builder/openipc/output/build/mabur-*/build.log
            openipc-builder/openipc/output/build/devourer-*/build.log
            openipc-builder/openipc/output/build/*/build.log
          if-no-files-found: warn
          retention-days: 14
